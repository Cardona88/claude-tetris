<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    // Aplica el tema guardado antes de pintar para evitar parpadeo (oscuro por defecto)
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; }
    catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema"></button>
    <h1 class="title">TETRIS</h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">⚡ RAYO</span>
          <span class="value" id="bolts">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>Z</kbd> rayo fila</li>
            <li><kbd>C</kbd> rayo columna</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="records-box" class="records-box hidden">
          <form id="record-form" class="record-form hidden">
            <label for="record-name">¡Entras al top 5! Tu nombre:</label>
            <div class="record-row">
              <input id="record-name" type="text" maxlength="12" autocomplete="off" placeholder="Nombre" />
              <button id="record-save" type="submit">Guardar</button>
            </div>
          </form>
          <table id="records-table" class="records-table"></table>
          <p id="records-stats" class="records-stats"></p>
          <button id="records-reset" class="records-reset" type="button">Resetear records</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- Pantalla de inicio: tabla de records + botón Jugar -->
    <div id="start-overlay" class="overlay">
      <div class="overlay-box">
        <p id="start-title">RECORDS</p>
        <table id="start-table" class="records-table"></table>
        <p id="start-stats" class="records-stats"></p>
        <button id="start-reset" class="records-reset" type="button">Resetear records</button>
        <button id="start-btn" type="button">Jugar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
