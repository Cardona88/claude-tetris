<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    // Aplica el tema guardado antes de pintar para evitar parpadeo (oscuro por defecto)
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; }
    catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <script>
    // Aplica el skin guardado antes de pintar (retro por defecto)
    try { document.documentElement.dataset.skin = localStorage.getItem('skin') || 'retro'; }
    catch (e) { document.documentElement.dataset.skin = 'retro'; }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <select id="skin-select" class="skin-select" aria-label="Cambiar skin">
      <option value="retro">Retro</option>
      <option value="neon">Neon</option>
      <option value="pastel">Pastel</option>
      <option value="pixel">Pixel art</option>
    </select>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar tema"></button>
    <h1 class="title">TETRIS</h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">⚡ RAYO</span>
          <span class="value" id="bolts">0</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>Z</kbd> rayo fila</li>
            <li><kbd>C</kbd> rayo columna</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="pause-menu" class="pause-menu hidden">
          <button id="resume-btn" class="menu-btn" type="button">Reanudar</button>
          <button id="pause-restart-btn" class="menu-btn" type="button">Reiniciar</button>
          <button id="controls-btn" class="menu-btn" type="button" aria-expanded="false">Ver controles</button>
          <ul id="controls-list" class="controls-list hidden">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>Z</kbd> rayo fila</li>
            <li><kbd>C</kbd> rayo columna</li>
            <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
          </ul>
          <label class="level-select" for="start-level">
            Nivel inicial
            <select id="start-level"></select>
          </label>
        </div>
        <form id="name-form" class="name-form hidden" autocomplete="off">
          <label for="name-input">¡Entras al top! Tu nombre:</label>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="12" placeholder="Anónimo" />
            <button id="save-btn" type="submit">Guardar</button>
          </div>
        </form>
        <div id="records" class="records hidden">
          <span class="label">🏆 RÉCORDS</span>
          <ol id="records-list"></ol>
          <p id="records-extra"></p>
          <button id="reset-records-btn" type="button">Borrar récords</button>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
